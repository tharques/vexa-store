name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python -m compileall -q bot panel
      - name: Simulação ponta a ponta (10 clientes)
        run: python -m tests.sim
      - name: Secrets faltando
        if: ${{ env.HAS_VPS != 'true' }}
        run: echo "::warning::Deploy pulado. Cadastre VPS_HOST, VPS_PASSWORD (ou VPS_SSH_KEY) e ENV_FILE."
      - name: Deploy na VPS
        if: ${{ env.HAS_VPS == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ENV_FILE,REPO,TOKEN
          script: |
            set -e
            command -v docker >/dev/null || (curl -fsSL https://get.docker.com | sh)
            mkdir -p /opt/vexa && cd /opt/vexa
            if [ ! -d .git ]; then git clone https://x-access-token:$TOKEN@github.com/$REPO .; fi
            git remote set-url origin https://x-access-token:$TOKEN@github.com/$REPO
            git fetch -q origin main && git reset -q --hard origin/main
            # escapa '$' (docker compose interpola variáveis no env_file; chave Asaas começa com '$')
            printf '%s\n' "$ENV_FILE" | sed 's/\$\$/$/g; s/\$/$$/g' > .env
            chmod 600 .env
            # Caddy (HTTPS do painel) só sobe se 80/443 estiverem livres ou já forem do nosso Caddy
            OURS=$(docker compose --profile https ps -q caddy 2>/dev/null || true)
            BUSY=$(ss -ltnH '( sport = :80 or sport = :443 )' 2>/dev/null || true)
            if [ -n "$BUSY" ] && [ -z "$OURS" ]; then
              echo "::warning::Portas 80/443 já em uso na VPS por outro serviço. Caddy NÃO foi iniciado; nada foi derrubado."
              ss -ltnp '( sport = :80 or sport = :443 )' | sed -E 's/pid=[0-9]+,//g' || true
              docker compose up -d --build vexa painel 2>&1 | grep -v 'variable is not set' || true
              # 80/443 são de um Caddy do Gestor que roda isolado (outro namespace: o arquivo não aparece no host).
              # Aprovado pelo dono em 25/11/2026: acessa o Caddyfile pelo /proc do processo, só ACRESCENTA o site do
              # painel, confere a sintaxe e recarrega pela API do Caddy (sem reiniciar). Falhou -> restaura o backup.
              DOMAIN="${PANEL_DOMAIN:-vexa.traxor.pro}"; PPORT="${PANEL_PORT:-18080}"
              PID=$(pgrep -xo caddy || true)
              echo "---- diagnóstico do Caddy do Gestor ----"
              if [ -n "$PID" ]; then
                echo "pid=$PID usuário=$(ps -o user= -p $PID) cmd=$(tr '\0' ' ' < /proc/$PID/cmdline)"
                echo "cgroup: $(head -3 /proc/$PID/cgroup | tr '\n' ' ')"
                echo "mesma rede do host: $([ "$(readlink /proc/$PID/ns/net)" = "$(readlink /proc/1/ns/net)" ] && echo sim || echo não)"
                echo "mesmo filesystem do host: $([ "$(readlink /proc/$PID/ns/mnt)" = "$(readlink /proc/1/ns/mnt)" ] && echo sim || echo não)"
                systemctl status caddy --no-pager 2>/dev/null | head -4 || true
                CFG=$(tr '\0' '\n' < /proc/$PID/cmdline | awk 'p{print;exit} $0=="--config"{p=1}')
                CF="/proc/$PID/root${CFG:-/etc/caddy/Caddyfile}"
                ADMIN="localhost:2019"
                api() { if [ "$(readlink /proc/$PID/ns/net)" = "$(readlink /proc/1/ns/net)" ]; then curl -s "$@"; else nsenter -t "$PID" -n curl -s "$@"; fi; }
                echo "config: $CFG · existe via /proc: $([ -f "$CF" ] && echo sim || echo não) · admin API: $(api -o /dev/null -w '%{http_code}' http://$ADMIN/config/ || echo off)"
                if [ "$(readlink /proc/$PID/ns/net)" != "$(readlink /proc/1/ns/net)" ]; then
                  echo "::warning::Caddy do Gestor está em outra rede; 127.0.0.1:$PPORT não é alcançável por ele. Nada alterado."
                elif [ ! -f "$CF" ]; then
                  echo "::warning::Caddyfile não encontrado nem via /proc; nada alterado."
                elif grep -q "# vexa-painel" "$CF"; then
                  echo "Caddy do Gestor já tem o site $DOMAIN"
                else
                  BK="/root/Caddyfile-gestor.bak-vexa-$(date +%Y%m%d%H%M%S)"; cp "$CF" "$BK"
                  printf '\n# vexa-painel (deploy de /opt/vexa)\n%s {\n\tencode gzip\n\treverse_proxy 127.0.0.1:%s\n}\n' "$DOMAIN" "$PPORT" >> "$CF"
                  CODE=$(api -o /tmp/vexa-caddy.log -w '%{http_code}' -X POST "http://$ADMIN/load" -H "Content-Type: text/caddyfile" --data-binary @"$CF" || echo 000)
                  if [ "$CODE" = "200" ]; then
                    echo "Caddy do Gestor recarregado com $DOMAIN -> 127.0.0.1:$PPORT (backup: $BK)"
                  else
                    cp "$BK" "$CF"; echo "::warning::Caddy recusou a config (HTTP $CODE); arquivo original restaurado, Gestor intacto."
                    head -c 600 /tmp/vexa-caddy.log; echo
                  fi
                fi
              else
                echo "::warning::Nenhum processo caddy encontrado."
              fi
              echo "---- fim do diagnóstico ----"
            else
              docker compose --profile https up -d --build 2>&1 | grep -v 'variable is not set' || true
            fi
            echo "---- aguardando 20s e conferindo bot, painel e HTTPS ----"
            sleep 20
            docker compose --profile https ps -a
            docker compose --profile https logs --tail 40 2>&1 | sed -E 's/[0-9]{8,}:[A-Za-z0-9_-]{30,}/***TOKEN***/g; s/\$?aact_[A-Za-z0-9_=:$-]+/***ASAAS***/g; s/(Senha|senha|password)[^ ]*[:=] *[^ ]+/\1 ***/g'
            curl -s -o /dev/null -w "painel interno: HTTP %{http_code}\n" --max-time 10 http://127.0.0.1:${PANEL_PORT:-18080}/health || true
            curl -s -o /dev/null -w "painel HTTPS: HTTP %{http_code}\n" --max-time 20 https://${PANEL_DOMAIN:-vexa.traxor.pro}/health || true
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' && (secrets.VPS_PASSWORD != '' || secrets.VPS_SSH_KEY != '') && secrets.ENV_FILE != '' }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      REPO: ${{ github.repository }}
      TOKEN: ${{ github.token }}
