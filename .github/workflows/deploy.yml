name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python -m compileall -q bot panel
      - name: Simulação ponta a ponta (10 clientes)
        run: python -m tests.sim
      - name: Secrets faltando
        if: ${{ env.HAS_VPS != 'true' }}
        run: echo "::warning::Deploy pulado. Cadastre VPS_HOST, VPS_PASSWORD (ou VPS_SSH_KEY) e ENV_FILE."
      - name: Deploy na VPS
        if: ${{ env.HAS_VPS == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ENV_FILE,REPO,TOKEN
          script: |
            set -e
            command -v docker >/dev/null || (curl -fsSL https://get.docker.com | sh)
            mkdir -p /opt/vexa && cd /opt/vexa
            if [ ! -d .git ]; then git clone https://x-access-token:$TOKEN@github.com/$REPO .; fi
            git remote set-url origin https://x-access-token:$TOKEN@github.com/$REPO
            git fetch -q origin main && git reset -q --hard origin/main
            # escapa '$' (docker compose interpola variáveis no env_file; chave Asaas começa com '$')
            printf '%s\n' "$ENV_FILE" | sed 's/\$\$/$/g; s/\$/$$/g' > .env
            chmod 600 .env
            # Caddy (HTTPS do painel) só sobe se 80/443 estiverem livres ou já forem do nosso Caddy
            OURS=$(docker compose --profile https ps -q caddy 2>/dev/null || true)
            BUSY=$(ss -ltnH '( sport = :80 or sport = :443 )' 2>/dev/null || true)
            if [ -n "$BUSY" ] && [ -z "$OURS" ]; then
              echo "::warning::Portas 80/443 já em uso na VPS por outro serviço. Caddy NÃO foi iniciado; nada foi derrubado."
              ss -ltnp '( sport = :80 or sport = :443 )' | sed -E 's/pid=[0-9]+,//g' || true
              docker compose up -d --build vexa painel 2>&1 | grep -v 'variable is not set' || true
              # 80/443 são do Caddy do Gestor (systemd, protegido). Aprovado pelo dono em 25/11/2026.
              # 1) Insere SÓ a rota do painel pela API admin (não substitui nada do Gestor, sem reiniciar).
              # 2) Persiste no /etc/caddy/Caddyfile do host só se a sintaxe validar (para sobreviver a reinício).
              # Roda isolado com set +e: qualquer falha aqui não derruba o deploy nem o Gestor.
              ( set +e
              DOMAIN="${PANEL_DOMAIN:-vexa.traxor.pro}"; PPORT="${PANEL_PORT:-18080}"; API="http://localhost:2019"
              echo "---- Caddy do Gestor ----"
              if ! curl -sf -o /dev/null "$API/config/"; then echo "::warning::API admin do Caddy não responde; nada alterado."; exit 0; fi
              CONF=$(curl -s "$API/config/")
              if echo "$CONF" | grep -q "\"$DOMAIN\""; then
                echo "rota $DOMAIN já ativa no Caddy"
              else
                SRV=$(echo "$CONF" | python3 -c 'import sys,json; s=json.load(sys.stdin).get("apps",{}).get("http",{}).get("servers",{}); print(next((k for k,v in s.items() if any(str(l).endswith(":443") for l in v.get("listen",[]))), next(iter(s),"")))')
                echo "servidor HTTPS do Caddy: ${SRV:-nenhum}"
                ROUTE="{\"match\":[{\"host\":[\"$DOMAIN\"]}],\"handle\":[{\"handler\":\"subroute\",\"routes\":[{\"handle\":[{\"handler\":\"encode\",\"encodings\":{\"gzip\":{}}},{\"handler\":\"reverse_proxy\",\"upstreams\":[{\"dial\":\"127.0.0.1:$PPORT\"}]}]}]}],\"terminal\":true}"
                if [ -n "$SRV" ]; then
                  CODE=$(curl -s -o /tmp/vexa-caddy.log -w '%{http_code}' -X PUT "$API/config/apps/http/servers/$SRV/routes/0" -H "Content-Type: application/json" -d "$ROUTE")
                  if [ "$CODE" = "200" ]; then echo "rota $DOMAIN -> 127.0.0.1:$PPORT adicionada no Caddy do Gestor (sem reiniciar)"
                  else echo "::warning::Caddy recusou a rota (HTTP $CODE): $(head -c 400 /tmp/vexa-caddy.log)"; fi
                fi
              fi
              CF=/etc/caddy/Caddyfile
              if [ -f "$CF" ] && ! grep -q "# vexa-painel" "$CF"; then
                TMP=$(mktemp); cp "$CF" "$TMP"
                printf '\n# vexa-painel (deploy de /opt/vexa)\n%s {\n\tencode gzip\n\treverse_proxy 127.0.0.1:%s\n}\n' "$DOMAIN" "$PPORT" >> "$TMP"
                if caddy adapt --config "$TMP" --adapter caddyfile >/dev/null 2>&1; then
                  cp "$CF" "/root/Caddyfile.bak-vexa-$(date +%Y%m%d%H%M%S)" && cat "$TMP" > "$CF" && echo "persistido em $CF (backup em /root)"
                else echo "::warning::não persisti no Caddyfile (sintaxe não validou); a rota segue ativa via API e o deploy a reaplica."; fi
                rm -f "$TMP"
              fi
              echo "---- fim Caddy ----" ) || true
            else
              docker compose --profile https up -d --build 2>&1 | grep -v 'variable is not set' || true
            fi
            echo "---- aguardando 20s e conferindo bot, painel e HTTPS ----"
            sleep 20
            docker compose --profile https ps -a
            if grep -qE '^SANDBOX=["$]*1' .env; then echo "MODO: SANDBOX LIGADO - pagamentos simulados, NAO venda assim"; else echo "MODO: producao (sandbox desligado)"; fi
            # log público (repo público): só o bot, sem o painel (acessos), com IPs e segredos mascarados
            docker compose logs --tail 25 vexa 2>&1 | sed -E 's/[0-9]{8,}:[A-Za-z0-9_-]{30,}/***TOKEN***/g; s/\$?aact_[A-Za-z0-9_=:$-]+/***ASAAS***/g; s/(Senha|senha|password)[^ ]*[:=] *[^ ]+/\1 ***/g; s/([0-9]{1,3}\.){3}[0-9]{1,3}/x.x.x.x/g'
            docker compose logs --tail 200 painel 2>&1 | grep -cE "Traceback|ERROR" | sed 's/^/erros recentes no painel: /' || true
            curl -s -o /dev/null -w "painel interno: HTTP %{http_code}\n" --max-time 10 http://127.0.0.1:${PANEL_PORT:-18080}/health || true
            curl -s -o /dev/null -w "painel HTTPS: HTTP %{http_code}\n" --max-time 20 https://${PANEL_DOMAIN:-vexa.traxor.pro}/health || true
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' && (secrets.VPS_PASSWORD != '' || secrets.VPS_SSH_KEY != '') && secrets.ENV_FILE != '' }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      REPO: ${{ github.repository }}
      TOKEN: ${{ github.token }}
