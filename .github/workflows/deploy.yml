name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python -m compileall -q bot panel
      - name: Simulação ponta a ponta (10 clientes)
        run: python -m tests.sim
      - name: Secrets faltando
        if: ${{ env.HAS_VPS != 'true' }}
        run: echo "::warning::Deploy pulado. Cadastre VPS_HOST, VPS_PASSWORD (ou VPS_SSH_KEY) e ENV_FILE."
      - name: Deploy na VPS
        if: ${{ env.HAS_VPS == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ENV_FILE,REPO,TOKEN
          script: |
            set -e
            command -v docker >/dev/null || (curl -fsSL https://get.docker.com | sh)
            mkdir -p /opt/vexa && cd /opt/vexa
            if [ ! -d .git ]; then git clone https://x-access-token:$TOKEN@github.com/$REPO .; fi
            git remote set-url origin https://x-access-token:$TOKEN@github.com/$REPO
            git fetch -q origin main && git reset -q --hard origin/main
            # escapa '$' (docker compose interpola variáveis no env_file; chave Asaas começa com '$')
            printf '%s\n' "$ENV_FILE" | sed 's/\$\$/$/g; s/\$/$$/g' > .env
            chmod 600 .env
            # Caddy (HTTPS do painel) só sobe se 80/443 estiverem livres ou já forem do nosso Caddy
            OURS=$(docker compose --profile https ps -q caddy 2>/dev/null || true)
            BUSY=$(ss -ltnH '( sport = :80 or sport = :443 )' 2>/dev/null || true)
            if [ -n "$BUSY" ] && [ -z "$OURS" ]; then
              echo "::warning::Portas 80/443 já em uso na VPS por outro serviço. Caddy NÃO foi iniciado; nada foi derrubado."
              ss -ltnp '( sport = :80 or sport = :443 )' | sed -E 's/pid=[0-9]+,//g' || true
              docker compose up -d --build vexa painel 2>&1 | grep -v 'variable is not set' || true
              # 80/443 são do Caddy do Gestor (container). Aprovado pelo dono em 25/11/2026: acha o Caddyfile montado
              # no host e só ACRESCENTA o site do painel. Backup, valida, recarrega sem derrubar; se falhar, restaura.
              DOMAIN="${PANEL_DOMAIN:-vexa.traxor.pro}"; PPORT="${PANEL_PORT:-18080}"
              CID=$(docker ps --format '{{.ID}} {{.Image}} {{.Names}}' | awk '($2 ~ /caddy/ || $3 ~ /caddy/) && $3 !~ /^vexa-/ {print $1; exit}')
              if [ -n "$CID" ]; then
                CNAME=$(docker inspect -f '{{.Name}}' "$CID"); NET=$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$CID")
                SRC=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/etc/caddy/Caddyfile"}}{{.Source}}{{end}}{{end}}' "$CID")
                if [ -z "$SRC" ]; then
                  D=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/etc/caddy"}}{{.Source}}{{end}}{{end}}' "$CID")
                  [ -n "$D" ] && SRC="$D/Caddyfile"
                fi
                echo "Caddy do Gestor: container $CNAME · rede $NET · Caddyfile no host: ${SRC:-não montado}"
                if [ "$NET" = "host" ]; then UP="127.0.0.1:$PPORT"; else
                  docker network connect vexa_default "$CID" 2>/dev/null || true; UP="vexa-painel-1:8000"; fi
                if [ -n "$SRC" ] && [ -f "$SRC" ]; then
                  if grep -q "# vexa-painel" "$SRC"; then
                    echo "Caddy do Gestor já serve $DOMAIN"
                  else
                    BK="$SRC.bak-vexa-$(date +%Y%m%d%H%M%S)"; cp "$SRC" "$BK"
                    printf '\n# vexa-painel (deploy de /opt/vexa)\n%s {\n\tencode gzip\n\treverse_proxy %s\n}\n' "$DOMAIN" "$UP" >> "$SRC"
                    if docker exec "$CID" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/tmp/vexa-caddy.log 2>&1 && \
                       docker exec "$CID" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile >>/tmp/vexa-caddy.log 2>&1; then
                      echo "Caddy do Gestor recarregado com $DOMAIN -> $UP (backup: $BK)"
                    else
                      cp "$BK" "$SRC"; echo "::warning::Não deu para incluir $DOMAIN no Caddy do Gestor; arquivo original restaurado."
                      tail -8 /tmp/vexa-caddy.log
                    fi
                  fi
                else
                  echo "::warning::Caddyfile do Gestor não está montado do host; nada alterado. Mounts:"
                  docker inspect -f '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' "$CID"
                fi
              else
                echo "::warning::Container do Caddy não encontrado; nada alterado."
                docker ps --format '{{.Names}} {{.Image}} {{.Ports}}' | head -20
              fi
            else
              docker compose --profile https up -d --build 2>&1 | grep -v 'variable is not set' || true
            fi
            echo "---- aguardando 20s e conferindo bot, painel e HTTPS ----"
            sleep 20
            docker compose --profile https ps -a
            docker compose --profile https logs --tail 40 2>&1 | sed -E 's/[0-9]{8,}:[A-Za-z0-9_-]{30,}/***TOKEN***/g; s/\$?aact_[A-Za-z0-9_=:$-]+/***ASAAS***/g; s/(Senha|senha|password)[^ ]*[:=] *[^ ]+/\1 ***/g'
            curl -s -o /dev/null -w "painel interno: HTTP %{http_code}\n" --max-time 10 http://127.0.0.1:${PANEL_PORT:-18080}/health || true
            curl -s -o /dev/null -w "painel HTTPS: HTTP %{http_code}\n" --max-time 20 https://${PANEL_DOMAIN:-vexa.traxor.pro}/health || true
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' && (secrets.VPS_PASSWORD != '' || secrets.VPS_SSH_KEY != '') && secrets.ENV_FILE != '' }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      REPO: ${{ github.repository }}
      TOKEN: ${{ github.token }}
